services:

  # =====================================================
  # MYSQL DATABASE
  # =====================================================

  global_db:
    image: mysql:8.0
    container_name: global_db

    ports:
      - "3301:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: global_db

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: unless-stopped

    networks:
      - kaushal123

  # =====================================================
  # GLOBAL BOOKING SYSTEM
  # =====================================================

  globalbookingsystem:
    image: kaushal123/global-booking-system:v1
    container_name: globalbookingsystem
    hostname: globalbookingsystem

    ports:
      - "8080:8080"

    restart: unless-stopped

    mem_limit: 350m
    cpus: 0.50

    environment:
      SPRING_APPLICATION_NAME: Global-Booking-System

      SPRING_DATASOURCE_URL: jdbc:mysql://global_db:3306/global_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xms64m -Xmx128m"

    depends_on:
      global_db:
        condition: service_healthy

    networks:
      - kaushal123

# =====================================================
# NETWORK
# =====================================================

networks:
  kaushal123:
    driver: bridge